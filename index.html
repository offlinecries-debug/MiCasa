<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Casa</title>
<link rel="stylesheet" href="home.css">
</head>
<body>

<div class="house-wrap">
  <picture>
    <source media="(max-width: 820px)" srcset="assets/video/img/micasa-celular.jpg">
    <img src="assets/video/img/micasa-compu.jpg" alt="Casa ilustrada, entrada al sitio" class="house-img">
  </picture>

  <div class="site-title">mi casa</div>

  <a href="memorias.html" class="hotspot" style="left:33%; top:19%; width:11%; height:23%;" data-m-left="27.27" data-m-top="28.37" data-m-width="18.04" data-m-height="17.79" aria-label="Memorias"><span class="hotspot-label">memorias</span></a>
  <img class="room-png room-png--memorias" src="assets/ventana-redonda-memorias-home.png" alt="" style="left:29.35%; top:8.15%; width:20.11%; height:48.02%; animation-delay: 1s;" data-m-left="21.29" data-m-top="19.98" data-m-width="32.98" data-m-height="37.14">

  <a href="archivos.html" class="hotspot" style="left:32%; top:41%; width:12%; height:42%;" data-m-left="25.63" data-m-top="45.39" data-m-width="19.68" data-m-height="32.48" aria-label="Archivos"><span class="hotspot-label">archivos</span></a>
  <img class="room-png room-png--archivos" src="assets/puerta-archivos-home.png" alt="" style="left:24.76%; top:25.88%; width:29.006%; height:71.01%; animation-delay: 1.3s;" data-m-left="13.76" data-m-top="33.68" data-m-width="47.58" data-m-height="54.92">

  <a href="pensamientos.html" class="hotspot" style="left:45%; top:66%; width:6%; height:13%;" data-m-left="46.95" data-m-top="64.72" data-m-width="9.84" data-m-height="10.05" aria-label="Pensamientos"><span class="hotspot-label">pensamientos</span></a>
  <img class="room-png room-png--pensamientos" src="assets/buzon-pensamientos-home.png" alt="" style="left:44.18%; top:53.83%; width:10.716%; height:26.85%; animation-delay: 1.6s;" data-m-left="45.60" data-m-top="55.31" data-m-width="17.58" data-m-height="20.77">

  <a href="trabajo.html" class="hotspot" style="left:55%; top:62%; width:8%; height:19%;" data-m-left="63.35" data-m-top="61.63" data-m-width="13.12" data-m-height="14.69" aria-label="Trabajo"><span class="hotspot-label">trabajo</span></a>
  <img class="room-png room-png--trabajo" src="assets/ventana-vieja-trabajo-home.png" alt="" style="left:52.71%; top:45.50%; width:17.12%; height:36.44%; animation-delay: 1.9s;" data-m-left="59.60" data-m-top="48.87" data-m-width="28.08" data-m-height="28.19">

  <a href="escuchas.html" class="hotspot" style="left:27%; top:70%; width:4%; height:10%;" data-m-left="17.43" data-m-top="67.82" data-m-width="6.56" data-m-height="7.73" aria-label="Escuchas"><span class="hotspot-label">escuchas</span></a>
  <img class="room-png room-png--escuchas" src="assets/puerta-escuchas-home.png" alt="" style="left:24.49%; top:62.40%; width:10.357%; height:19.70%; animation-delay: 2.2s;" data-m-left="13.32" data-m-top="61.94" data-m-width="16.99" data-m-height="15.24">
</div>

<script>
  document.querySelectorAll('.hotspot').forEach(function (h) {
    h.addEventListener('touchstart', function () {
      h.classList.add('tap-active');
      setTimeout(function () { h.classList.remove('tap-active'); }, 300);
    }, { passive: true });
  });

  // En celular la imagen de fondo se muestra con object-fit: cover, así que
  // el recorte visible depende del tamaño real de cada pantalla. Acá
  // calculamos, para el tamaño real del dispositivo, dónde cae cada
  // elemento (data-m-left/top/width/height son porcentajes contra la
  // imagen ENTERA, no contra la pantalla) en vez de usar un único
  // porcentaje fijo calculado para un solo celular de referencia.
  var mq = window.matchMedia('(max-width: 820px)');
  var img = document.querySelector('.house-img');
  var wrap = document.querySelector('.house-wrap');
  var els = document.querySelectorAll('.hotspot, .room-png');

  function layoutMobile() {
    if (!mq.matches) {
      els.forEach(function (el) {
        if (el.dataset.origStyle !== undefined) el.setAttribute('style', el.dataset.origStyle);
      });
      return;
    }
    var naturalW = img.naturalWidth, naturalH = img.naturalHeight;
    if (!naturalW || !naturalH) return;

    var cw = wrap.clientWidth, ch = wrap.clientHeight;
    var scale = Math.max(cw / naturalW, ch / naturalH);
    var dispW = naturalW * scale, dispH = naturalH * scale;
    var posX = 0.43, posY = 0.5;
    var cropLeft = (dispW - cw) * posX;
    var cropTop = (dispH - ch) * posY;

    els.forEach(function (el) {
      if (el.dataset.origStyle === undefined) el.dataset.origStyle = el.getAttribute('style');
      var l = parseFloat(el.dataset.mLeft) / 100 * naturalW * scale - cropLeft;
      var t = parseFloat(el.dataset.mTop) / 100 * naturalH * scale - cropTop;
      var w = parseFloat(el.dataset.mWidth) / 100 * naturalW * scale;
      var h = parseFloat(el.dataset.mHeight) / 100 * naturalH * scale;
      el.style.left = l + 'px';
      el.style.top = t + 'px';
      el.style.width = w + 'px';
      el.style.height = h + 'px';
    });
  }

  if (img.complete) layoutMobile(); else img.addEventListener('load', layoutMobile);
  window.addEventListener('resize', layoutMobile);
  window.addEventListener('orientationchange', layoutMobile);
</script>

</body>
</html>
