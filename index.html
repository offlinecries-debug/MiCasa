<script>
  document.querySelectorAll('.hotspot').forEach(function (h) {
    h.addEventListener('touchstart', function () {
      h.classList.add('tap-active');
      setTimeout(function () { h.classList.remove('tap-active'); }, 300);
    }, { passive: true });
  });

  // El fondo de la casa ahora es un background-image con cover (ver CSS),
  // así que siempre cubre toda la pantalla pero recorta bordes según la
  // proporción real de cada ventana/dispositivo. Acá replicamos ese mismo
  // recorte para ubicar los hotspots y las decoraciones: data-d-* son
  // porcentajes contra la imagen ENTERA de escritorio, data-m-* contra la
  // de celular, nunca contra la ventana.
  var mq = window.matchMedia('(max-width: 820px)');
  var wrap = document.querySelector('.house-wrap');
  var els = document.querySelectorAll('.hotspot, .room-png, .frase-deco');

  var FOCUS = {
    desktop: { x: 0.5, y: 0.5 },
    mobile: { x: 0.43, y: 0.5 }
  };

  var bgImg = { desktop: new Image(), mobile: new Image() };
  var bgReady = { desktop: false, mobile: false };
  bgImg.desktop.onload = function () { bgReady.desktop = true; layout(); };
  bgImg.mobile.onload = function () { bgReady.mobile = true; layout(); };
  bgImg.desktop.src = 'assets/casa/micasa-compu.jpg';
  bgImg.mobile.src = 'assets/casa/micasa-celular.jpg';

  function layout() {
    var mode = mq.matches ? 'mobile' : 'desktop';
    if (!bgReady[mode]) return;

    var img = bgImg[mode];
    var prefix = mode === 'mobile' ? 'm' : 'd';
    var focus = FOCUS[mode];
    var naturalW = img.naturalWidth, naturalH = img.naturalHeight;

    var cw = wrap.clientWidth, ch = wrap.clientHeight;
    var scale = Math.max(cw / naturalW, ch / naturalH);
    var dispW = naturalW * scale, dispH = naturalH * scale;
    var cropLeft = (dispW - cw) * focus.x;
    var cropTop = (dispH - ch) * focus.y;

    els.forEach(function (el) {
      var l = parseFloat(el.dataset[prefix + 'Left']);
      var t = parseFloat(el.dataset[prefix + 'Top']);
      if (isNaN(l) || isNaN(t)) return; // ej: frase-deco no tiene versión mobile todavía
      el.style.left = (l / 100 * naturalW * scale - cropLeft) + 'px';
      el.style.top = (t / 100 * naturalH * scale - cropTop) + 'px';
      var w = parseFloat(el.dataset[prefix + 'Width']);
      var h = parseFloat(el.dataset[prefix + 'Height']);
      if (!isNaN(w)) el.style.width = (w / 100 * naturalW * scale) + 'px';
      if (!isNaN(h)) el.style.height = (h / 100 * naturalH * scale) + 'px';
    });
  }

  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
</script>
